services:
  - type: web
    name: nexora
    runtime: node
    plan: free
    buildCommand: npm ci --prefix client && npm run build --prefix client && npm ci --prefix server
    startCommand: npm start --prefix server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        value: http://localhost:5173
